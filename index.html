<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F5F3EF">
<title>测测你的“活人感”浓度：你在朋友圈里还剩多少真实？</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  /* ========== 得意黑（标题字体） ========== */
  @font-face {
    font-family: 'Smiley Sans';
    src: url('https://cdn.jsdelivr.net/npm/smiley-sans@2.0.1/dist/SmileySans-Oblique.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/atelier-anchor/smiley-sans@v2.0.1/dist/SmileySans-Oblique.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg:      #F5F3EF;
    --card:    #FFFFFF;
    --ink:     #2B2A28;
    --ink-2:   #6B6862;
    --ink-3:   #A8A39A;
    --coral:   #FF8B6A;
    --blue:    #7BA7D7;
    --yellow:  #F0C24B;
    --matcha:  #8FBC8F;
    --line:    #E8E4DC;
    --font-display: 'Smiley Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.6;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px calc(44px + env(safe-area-inset-bottom));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ========== 屏幕切换 ========== */
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; animation: screenIn 0.45s cubic-bezier(0.22,0.68,0.32,1) both; }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ========== 首页 ========== */
  #screen-intro.active {
    justify-content: center;
    padding-bottom: 5vh;
  }

  .tag-rot {
    display: inline-block;
    align-self: flex-start;
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--ink-2);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 7px 15px;
    transform: rotate(-1.6deg);
    margin-bottom: 24px;
    font-weight: 500;
  }

  .hero-title {
    font-family: var(--font-display);
    font-size: 40px;
    line-height: 1.28;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--ink);
    margin: 0 0 28px;
    text-align: left;
  }

  .hero-title .mark {
    position: relative;
    display: inline-block;
    background: linear-gradient(180deg,
      transparent 58%,
      var(--yellow) 58%,
      var(--yellow) 90%,
      transparent 90%);
    padding: 0 4px;
  }

  /* Bento 小格子 */
  .bento-row {
    display: flex;
    gap: 9px;
    margin-bottom: 22px;
  }

  .bento-chip {
    flex: 1;
    border-radius: 20px;
    padding: 16px 14px;
    border: 1.5px solid transparent;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .chip-coral  { background: #FFE8E0; border-color: #FFD2C4; }
  .chip-blue   { background: #E5F0FA; border-color: #CFE0F2; }
  .chip-matcha { background: #E6F3E6; border-color: #CFE7CF; }

  .chip-num {
    font-family: var(--font-display);
    font-size: 27px;
    line-height: 1;
    font-weight: 400;
    color: var(--ink);
  }

  .chip-label {
    font-size: 11.5px;
    color: var(--ink-2);
    letter-spacing: 0.06em;
  }

  .quote-card {
    background: #fff;
    border-radius: 22px;
    padding: 22px 22px 22px 24px;
    border: 1.5px solid var(--line);
    font-size: 14.5px;
    line-height: 2;
    color: var(--ink-2);
    letter-spacing: 0.03em;
    margin-bottom: 30px;
    position: relative;
  }

  .quote-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 22px;
    bottom: 22px;
    width: 4px;
    border-radius: 0 4px 4px 0;
    background: var(--coral);
  }

  .btn-main {
    width: 100%;
    padding: 19px 24px;
    border-radius: 22px;
    border: none;
    background: var(--ink);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.14em;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    transition: transform 0.16s ease, background 0.16s ease;
  }

  .btn-main:active {
    transform: scale(0.975);
    background: #1A1918;
  }

  .btn-main .arrow {
    font-size: 17px;
    transition: transform 0.25s ease;
  }

  .btn-main:active .arrow {
    transform: translateX(3px);
  }

  .fine-print {
    margin: 20px 0 0;
    font-size: 11px;
    line-height: 1.8;
    color: var(--ink-3);
    text-align: center;
    letter-spacing: 0.02em;
  }

  /* ========== 答题页 ========== */
  .quiz-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 0 22px;
    flex: 0 0 auto;
  }

  .dot-progress {
    display: flex;
    gap: 4px;
    flex: 1;
  }

  .dot {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--line);
    transition: background 0.35s ease, transform 0.35s ease;
  }

  .dot.done { background: var(--coral); }
  .dot.current {
    background: var(--coral);
    transform: scaleY(1.6);
    border-radius: 4px;
  }

  .counter {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    font-weight: 500;
  }

  .counter #qIndex {
    color: var(--ink);
    font-weight: 700;
    font-size: 13px;
  }

  .qcard {
    position: relative;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 26px;
    padding: 26px 22px 22px;
    min-height: 400px;
    flex: 0 0 auto;
    transition: opacity 0.26s cubic-bezier(0.4,0,0.2,1),
                transform 0.26s cubic-bezier(0.4,0,0.2,1);
  }

  .qcard.out {
    opacity: 0;
    transform: translateX(-28px);
  }

  .qcard.pre {
    transition: none !important;
    opacity: 0;
    transform: translateX(28px);
  }

  .qnum {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--ink);
    background: var(--yellow);
    border-radius: 8px;
    padding: 3px 10px;
    margin-bottom: 16px;
    font-weight: 400;
  }

  .qtext {
    font-size: 16.5px;
    line-height: 1.75;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 22px;
    letter-spacing: 0.005em;
  }

  .options {
    display: flex;
    flex-direction: column;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 15px 16px;
    margin-bottom: 10px;
    border-radius: 18px;
    background: #FCFBF9;
    border: 1.5px solid var(--line);
    color: var(--ink-2);
    font-size: 14px;
    line-height: 1.62;
    font-family: inherit;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    transition: background 0.22s ease, border-color 0.22s ease,
                color 0.22s ease, transform 0.14s ease;
  }

  .option:last-child { margin-bottom: 0; }

  .option:active { transform: scale(0.985); }

  .option .dot-color {
    flex: 0 0 10px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--opt-color, #ccc);
    margin-top: 6px;
    transition: transform 0.24s cubic-bezier(0.34,1.56,0.64,1);
  }

  .option .otext { flex: 1; }

  .option.selected {
    background: var(--opt-bg, #F0F0F0);
    border-color: var(--opt-color, #999);
    color: var(--ink);
    font-weight: 500;
  }

  .option.selected .dot-color {
    transform: scale(1.5);
  }

  .back-btn {
    margin: 20px auto 0;
    display: block;
    background: transparent;
    border: none;
    color: var(--ink-3);
    font-size: 13px;
    letter-spacing: 0.06em;
    font-family: inherit;
    cursor: pointer;
    padding: 8px 16px;
    transition: color 0.2s ease, opacity 0.25s ease;
    opacity: 0;
    pointer-events: none;
  }

  .back-btn.show {
    opacity: 1;
    pointer-events: auto;
  }

  .back-btn:active { color: var(--ink-2); }

  /* ========== 分析中 ========== */
  .loading-inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    padding-bottom: 8vh;
  }

  .loader-dots {
    display: flex;
    gap: 10px;
  }

  .loader-dots span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    animation: bounce 1.3s ease-in-out infinite;
  }

  .loader-dots span:nth-child(1) { background: var(--coral);  animation-delay: 0s; }
  .loader-dots span:nth-child(2) { background: var(--blue);   animation-delay: 0.16s; }
  .loader-dots span:nth-child(3) { background: var(--yellow); animation-delay: 0.32s; }
  .loader-dots span:nth-child(4) { background: var(--matcha); animation-delay: 0.48s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
    30%           { transform: translateY(-13px); opacity: 1; }
  }

  .loading-text {
    font-family: var(--font-display);
    font-size: 17px;
    letter-spacing: 0.12em;
    color: var(--ink);
    margin: 0;
    animation: breathe 2.2s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  /* ========== 结果页 ========== */
  .res-tag {
    display: inline-block;
    align-self: flex-start;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    color: var(--ink-2);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 16px;
    font-weight: 500;
  }

  .res-name {
    font-family: var(--font-display);
    font-size: 38px;
    line-height: 1.28;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--ink);
    margin: 0 0 18px;
    text-align: left;
  }

  .res-line {
    font-size: 14.5px;
    line-height: 1.85;
    color: var(--ink-2);
    margin: 0 0 26px;
    letter-spacing: 0.01em;
    background: #fff;
    border-radius: 20px;
    padding: 20px 22px;
    border: 1.5px solid var(--line);
  }

  .radar-card {
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 24px;
    padding: 16px 12px;
    margin-bottom: 16px;
    pointer-events: none;
  }

  #radar { display: block; margin: 0 auto; }

  /* 四维 Bento 网格 */
  .dim-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-bottom: 18px;
  }

  .dim-cell {
    border-radius: 18px;
    padding: 15px 15px 16px;
    border: 1.5px solid transparent;
  }

  .dim-cell.d0 { background: #FFE8E0; border-color: #FFD2C4; }
  .dim-cell.d1 { background: #E5F0FA; border-color: #CFE0F2; }
  .dim-cell.d2 { background: #FEF6E0; border-color: #F5E6BC; }
  .dim-cell.d3 { background: #E6F3E6; border-color: #CFE7CF; }

  .dim-name {
    font-size: 12px;
    color: var(--ink-2);
    letter-spacing: 0.06em;
    margin-bottom: 9px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
  }

  .dim-name b {
    font-family: var(--font-display);
    font-size: 19px;
    color: var(--ink);
    font-weight: 400;
    line-height: 1;
  }

  .dim-track {
    height: 5px;
    border-radius: 4px;
    background: rgba(255,255,255,0.75);
    overflow: hidden;
  }

  .dim-fill {
    height: 100%;
    width: 0;
    border-radius: 4px;
    transition: width 0.95s cubic-bezier(0.22,0.68,0.32,1);
  }

  .d0 .dim-fill { background: var(--coral); }
  .d1 .dim-fill { background: var(--blue); }
  .d2 .dim-fill { background: var(--yellow); }
  .d3 .dim-fill { background: var(--matcha); }

  /* 报告卡片 */
  .report {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .block {
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 22px;
    padding: 20px 20px 18px;
  }

  .block-head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 13px;
  }

  .block-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: 0 0 9px;
  }

  .block h3 {
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin: 0;
    font-weight: 400;
  }

  .block p {
    margin: 0;
    font-size: 14px;
    line-height: 1.95;
    color: var(--ink-2);
    letter-spacing: 0.01em;
  }

  .block ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .block li {
    position: relative;
    padding-left: 18px;
    font-size: 14px;
    line-height: 1.95;
    color: var(--ink-2);
    margin-bottom: 9px;
    letter-spacing: 0.01em;
  }

  .block li:last-child { margin-bottom: 0; }

  .block li::before {
    content: '';
    position: absolute;
    left: 2px;
    top: 11px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--coral);
  }

  /* 关键词卡 */
  .keyword-card {
    margin-top: 14px;
    padding: 30px 24px;
    border-radius: 24px;
    text-align: center;
    background: var(--ink);
    color: #fff;
    position: relative;
    overflow: hidden;
  }

  .keyword-card::before {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: var(--coral);
    opacity: 0.18;
  }

  .keyword-card::after {
    content: '';
    position: absolute;
    bottom: -40px;
    left: -20px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: var(--matcha);
    opacity: 0.15;
  }

  .kw-label {
    position: relative;
    font-size: 10.5px;
    letter-spacing: 0.38em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 16px;
  }

  .kw-text {
    position: relative;
    font-family: var(--font-display);
    font-size: 19px;
    line-height: 1.7;
    color: #fff;
    letter-spacing: 0.02em;
  }

  .note {
    margin: 26px 0 0;
    font-size: 12.5px;
    line-height: 1.95;
    color: var(--ink-3);
    text-align: center;
    letter-spacing: 0.03em;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  .actions .btn-main {
    flex: 1.3;
    padding: 17px 12px;
    font-size: 15px;
    letter-spacing: 0.1em;
  }

  .btn-ghost {
    flex: 1;
    padding: 17px 12px;
    border-radius: 22px;
    background: #fff;
    border: 1.5px solid var(--line);
    color: var(--ink-2);
    font-size: 15px;
    letter-spacing: 0.1em;
    font-family: inherit;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
  }

  .btn-ghost:active {
    transform: scale(0.975);
    background: #F0EDE7;
    border-color: #DCD7CD;
  }

  .footnote {
    margin: 24px 0 0;
    font-size: 11px;
    line-height: 1.85;
    color: var(--ink-3);
    text-align: center;
  }

  /* ========== Toast ========== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 46px;
    transform: translate(-50%, 16px);
    background: var(--ink);
    color: #fff;
    padding: 13px 24px;
    border-radius: 999px;
    font-size: 13.5px;
    letter-spacing: 0.05em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 99;
    white-space: nowrap;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @media (max-width: 360px) {
    .hero-title { font-size: 34px; }
    .res-name   { font-size: 32px; }
    .qtext      { font-size: 15.5px; }
    .option     { font-size: 13.5px; padding: 14px 14px; }
    .kw-text    { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ==================== 首页 ==================== -->
  <section id="screen-intro" class="screen active">
    <div class="tag-rot">活人感浓度 · 趣味自测</div>
    <h1 class="hero-title">
      你在朋友圈里<br>
      还剩多少<span class="mark">真实</span>？
    </h1>

    <div class="bento-row">
      <div class="bento-chip chip-coral">
        <div class="chip-num">12</div>
        <div class="chip-label">道情境题</div>
      </div>
      <div class="bento-chip chip-blue">
        <div class="chip-num">3</div>
        <div class="chip-label">分钟</div>
      </div>
      <div class="bento-chip chip-matcha">
        <div class="chip-num">4</div>
        <div class="chip-label">个维度</div>
      </div>
    </div>

    <div class="quote-card">
      你发了那么多条动态，修了那么多遍图，<br>
      却越来越不确定——<br>
      屏幕那边的人，认识的到底是不是你。
    </div>

    <button class="btn-main" id="startBtn">
      开始测试 <span class="arrow">→</span>
    </button>
    <p class="fine-print">本测试为趣味自测，不构成心理学诊断或医学建议。</p>
  </section>

  <!-- ==================== 答题页 ==================== -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-head">
      <div class="dot-progress" id="dotProgress"></div>
      <div class="counter"><span id="qIndex">01</span>/12</div>
    </div>

    <div class="qcard" id="qcard">
      <div class="qnum">Q<span id="qNum">01</span></div>
      <h2 class="qtext" id="qText"></h2>
      <div class="options" id="options"></div>
    </div>

    <button class="back-btn" id="backBtn">← 上一题</button>
  </section>

  <!-- ==================== 分析中 ==================== -->
  <section id="screen-loading" class="screen">
    <div class="loading-inner">
      <div class="loader-dots">
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="loading-text">正在分析你的活人感浓度……</p>
    </div>
  </section>

  <!-- ==================== 结果页 ==================== -->
  <section id="screen-result" class="screen">
    <div class="res-tag">你的活人感类型</div>
    <h1 class="res-name" id="resName"></h1>
    <p class="res-line" id="resLine"></p>

    <div class="radar-card">
      <canvas id="radar"></canvas>
    </div>

    <div class="dim-grid" id="dims"></div>

    <div class="report">
      <div class="block">
        <div class="block-head">
          <span class="block-dot" style="background:var(--coral)"></span>
          <h3>关于你</h3>
        </div>
        <p id="resDesc"></p>
      </div>

      <div class="block">
        <div class="block-head">
          <span class="block-dot" style="background:var(--blue)"></span>
          <h3>你在社交里的样子</h3>
        </div>
        <ul id="resTraits"></ul>
      </div>

      <div class="block">
        <div class="block-head">
          <span class="block-dot" style="background:var(--yellow)"></span>
          <h3>容易被误会的地方</h3>
        </div>
        <p id="resMis"></p>
      </div>

      <div class="block">
        <div class="block-head">
          <span class="block-dot" style="background:var(--matcha)"></span>

  function showScreen(id) {
    els.screens.forEach(function (s) {
      s.classList.toggle('active', s.id === id);
    });
    window.scrollTo(0, 0);
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  let toastTimer = null;
  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      els.toast.classList.remove('show');
    }, 2000);
  }

  /* =========================================================
     五、答题流程
     ========================================================= */
  function renderDots() {
    els.dotProgress.innerHTML = '';
    for (let i = 0; i < QUESTIONS.length; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      if (state.answers[i] !== null) d.classList.add('done');
      if (i === state.index) d.classList.add('current');
      els.dotProgress.appendChild(d);
    }
  }

  function renderQuestion(i) {
    const q = QUESTIONS[i];

    els.qIndex.textContent = pad2(i + 1);
    els.qNum.textContent   = pad2(i + 1);
    els.qText.textContent  = q.text;

    renderDots();

    els.options.innerHTML = '';
    q.options.forEach(function (opt, idx) {
      const color = OPT_COLORS[idx % OPT_COLORS.length];

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option';
      btn.style.setProperty('--opt-color', color.main);
      btn.style.setProperty('--opt-bg', color.bg);
      if (state.answers[i] === idx) btn.classList.add('selected');

      const dot = document.createElement('span');
      dot.className = 'dot-color';

      const txt = document.createElement('span');
      txt.className = 'otext';
      txt.textContent = opt.t;

      btn.appendChild(dot);
      btn.appendChild(txt);
      btn.addEventListener('click', function () { chooseOption(idx, btn); });
      els.options.appendChild(btn);
    });

    if (i > 0) els.backBtn.classList.add('show');
    else       els.backBtn.classList.remove('show');
  }

  function chooseOption(optIdx, btn) {
    if (state.animating) return;

    state.answers[state.index] = optIdx;
    btn.classList.add('selected');
    renderDots();

    state.animating = true;

    setTimeout(function () {
      if (state.index < QUESTIONS.length - 1) {
        state.index += 1;
        transitionToNext();
      } else {
        goLoading();
      }
    }, 300);
  }

  function transitionToNext() {
    const card = els.qcard;
    card.classList.add('out');

    setTimeout(function () {
      renderQuestion(state.index);

      card.classList.remove('out');
      card.classList.add('pre');
      void card.offsetWidth;
      card.classList.remove('pre');

      state.animating = false;
    }, 265);
  }

  function goBack() {
    if (state.animating || state.index === 0) return;
    state.animating = true;
    state.index -= 1;
    transitionToNext();
  }

  /* =========================================================
     六、计分与匹配（归一化加权距离 + 区分度加成）
     ========================================================= */
  function computeScores() {
    const raw = [0, 0, 0, 0];
    for (let i = 0; i < QUESTIONS.length; i++) {
      const ans = state.answers[i];
      const opt = QUESTIONS[i].options[ans === null ? 0 : ans];
      for (let d = 0; d < 4; d++) raw[d] += opt.v[d];
    }
    return raw.map(function (r, d) {
      const span = DIM_MAX[d] - DIM_MIN[d];
      const pct = (r - DIM_MIN[d]) / span * 100;
      return Math.round(Math.max(0, Math.min(100, pct)));
    });
  }

  function matchType(scores) {
    const norm = scores.map(function (s) { return s / 100; });

    /* 所有类型在各维度的平均值 */
    const dimAvgs = [0, 0, 0, 0];
    TYPES.forEach(function (t) {
      for (let d = 0; d < 4; d++) dimAvgs[d] += t.proto[d] / 100;
    });
    dimAvgs.forEach(function (a, d) { dimAvgs[d] /= TYPES.length; });

    let best = TYPES[0];
    let bestScore = Infinity;

    TYPES.forEach(function (type) {
      const protoNorm = type.proto.map(function (p) { return p / 100; });

      /* 标志性维度加权 */
      const weights = [0, 0, 0, 0];
      let weightSum = 0;
      for (let d = 0; d < 4; d++) {
        const dev = Math.abs(protoNorm[d] - dimAvgs[d]);
        weights[d] = 1 + dev * 3;
        weightSum += weights[d];
      }

      /* 加权欧氏距离 */
      let dist = 0;
      for (let d = 0; d < 4; d++) {
        const diff = norm[d] - protoNorm[d];
        dist += weights[d] * diff * diff;
      }
      dist /= weightSum;

      /* 区分度加成：原型越有辨识度，越容易被命中 */
      let variance = 0;
      for (let d = 0; d < 4; d++) {
        variance += Math.pow(protoNorm[d] - 0.5, 2);
      }
      variance /= 4;
      const bonus = 1 - variance * 0.3;

      const finalScore = dist * bonus;

      if (finalScore < bestScore) {
        bestScore = finalScore;
        best = type;
      }
    });

    return best;
  }

  /* =========================================================
     七、雷达图（浅色主题）
     ========================================================= */
  function setupRadar(values) {
    const canvas = els.radar;
    if (!canvas || !canvas.parentElement) return;

    const dpr = window.devicePixelRatio || 1;
    let wrapWidth = canvas.parentElement.clientWidth;

    if (wrapWidth <= 0) {
      wrapWidth = Math.min(window.innerWidth - 40, 480) - 64;
    }

    const size = Math.min(Math.max(wrapWidth, 200), 320);

    canvas.style.width  = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width  = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    animateRadar(ctx, size, values);
  }

  function drawRadar(ctx, size, values) {
    ctx.clearRect(0, 0, size, size);

    const cx = size / 2;
    const cy = size / 2;
    const R  = size * 0.27;
    const angles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];

    /* 网格环 */
    for (let ring = 1; ring <= 4; ring++) {
      const r = R * ring / 4;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const x = cx + Math.cos(angles[i]) * r;
        const y = cy + Math.sin(angles[i]) * r;
        if (i === 0) ctx.moveTo(x, y);
        else         ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = ring === 4 ? 'rgba(43,42,40,0.16)' : 'rgba(43,42,40,0.07)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    /* 轴线 */
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angles[i]) * R, cy + Math.sin(angles[i]) * R);
      ctx.strokeStyle = 'rgba(43,42,40,0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    /* 数据点 */
    const pts = [];
    for (let i = 0; i < 4; i++) {
      const v = Math.max(0, Math.min(100, values[i])) / 100;
      const r = R * v;
      pts.push([
        cx + Math.cos(angles[i]) * r,
        cy + Math.sin(angles[i]) * r
      ]);
    }

    /* 填充 */
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
      else         ctx.lineTo(pts[i][0], pts[i][1]);
    }
    ctx.closePath();

    const grad = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    grad.addColorStop(0, 'rgba(255,139,106,0.34)');
    grad.addColorStop(1, 'rgba(123,167,215,0.26)');
    ctx.fillStyle = grad;
    ctx.fill();

    /* 描边 */
    ctx.strokeStyle = '#FF8B6A';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    /* 顶点 */
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(pts[i][0], pts[i][1], 4, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.strokeStyle = '#FF8B6A';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    /* 标签 */
    ctx.font = '600 11.5px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#6B6862';
    const off = 13;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(DIM_NAMES[0], cx, cy - R - off + 5);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(DIM_NAMES[1], cx + R + off, cy);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(DIM_NAMES[2], cx, cy + R + off - 3);

    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(DIM_NAMES[3], cx - R - off, cy);
  }

  function animateRadar(ctx, size, target) {
    const duration = 880;
    const start = performance.now();

    function frame(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const current = target.map(function (v) { return v * eased; });
      drawRadar(ctx, size, current);
      if (p < 1) requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  /* =========================================================
     八、结果渲染
     ========================================================= */
  function renderResult() {
    const scores = computeScores();
    const type = matchType(scores);

    els.resName.textContent     = type.name;
    els.resLine.textContent     = type.line;
    els.resDesc.textContent     = type.desc;
    els.resMis.textContent      = type.misunderstand;
    els.resBoundary.textContent = type.boundary;
    els.resKeyword.textContent  = type.keyword;

    els.resTraits.innerHTML = '';
    type.traits.forEach(function (t) {
      const li = document.createElement('li');
      li.textContent = t;
      els.resTraits.appendChild(li);
    });

    /* 四维 Bento 网格 */
    els.dims.innerHTML = '';
    DIM_NAMES.forEach(function (name, i) {
      const cell = document.createElement('div');
      cell.className = 'dim-cell d' + i;

      const head = document.createElement('div');
      head.className = 'dim-name';
      const nm = document.createElement('span');
      nm.textContent = name;
      const val = document.createElement('b');
      val.textContent = scores[i];
      head.appendChild(nm);
      head.appendChild(val);

      const track = document.createElement('div');
      track.className = 'dim-track';
      const fill = document.createElement('div');
      fill.className = 'dim-fill';
      track.appendChild(fill);

      cell.appendChild(head);
      cell.appendChild(track);
      els.dims.appendChild(cell);

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          fill.style.width = scores[i] + '%';
        });
      });
    });

    /* 雷达图 */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        setupRadar(scores);
      });
    });
  }

  function goLoading() {
    showScreen('screen-loading');
    state.animating = true;

    setTimeout(function () {
      renderResult();
      showScreen('screen-result');
      state.animating = false;
    }, 2100);
  }

  /* =========================================================
     九、重置 / 分享
     ========================================================= */
  function resetAll() {
    state.index = 0;
    state.answers = new Array(QUESTIONS.length).fill(null);
    state.animating = false;

    els.dims.innerHTML = '';
    els.options.innerHTML = '';
    els.qText.textContent = '';
    els.resTraits.innerHTML = '';
    els.dotProgress.innerHTML = '';
  }

  function startQuiz() {
    resetAll();
    showScreen('screen-quiz');
    renderQuestion(0);
  }

  function shareResult() {
    const typeName = els.resName.textContent;
    const typeLine = els.resLine.textContent;
    const text = '我的活人感类型是' + typeName + '\n' + typeLine +
                 '\n\n测测你的“活人感”浓度：你在朋友圈里还剩多少真实？\n' + location.href;

    if (navigator.share) {
      navigator.share({ title: '测测你的活人感浓度', text: text }).catch(function () {});
      return;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('结果已复制，去粘贴分享吧');
      }).catch(function () { fallbackCopy(text); });
      return;
    }

    fallbackCopy(text);
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('结果已复制，去粘贴分享吧');
    } catch (e) {
      showToast('长按页面可手动复制结果');
    }
    document.body.removeChild(ta);
  }

  /* =========================================================
     十、事件绑定
     ========================================================= */
  els.startBtn.addEventListener('click', startQuiz);
  els.backBtn.addEventListener('click', goBack);
  els.retryBtn.addEventListener('click', function () {
    resetAll();
    showScreen('screen-intro');
  });
  els.shareBtn.addEventListener('click', shareResult);

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    if (!document.getElementById('screen-result').classList.contains('active')) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      const scores = computeScores();
      setupRadar(scores);
    }, 220);
  });

})();
</script>
</body>
</html>
